  <g font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="60" y="88" font-size="20" fill="#ffd9ec" letter-spacing="4" opacity="0.9">グリーンアルファ</text>
    <text x="58" y="170" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="6">GREENALPHA</text>
    <text x="62" y="212" font-size="22" fill="#ffe6f1" letter-spacing="5">O DESPERTAR DA CARTEIRA ESG</text>
    <text x="62" y="248" font-size="15" fill="#ffd0e3" letter-spacing="4" opacity="0.9">TEMPORADA 1  ·  ARCO FARIA LIMA</text>
