      <stop offset="0.55" stop-color="#ffc48a"/>
      <stop offset="1" stop-color="#ff8fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ffd9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7dffb2"/>
    </linearGradient>
    <pattern id="win" width="12" height="16" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="4" height="6" fill="#ffd98a" opacity="0.85"/>
    </pattern>
    <g id="far">
