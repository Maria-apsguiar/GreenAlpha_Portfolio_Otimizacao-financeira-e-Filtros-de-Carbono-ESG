  <g fill="#7dffb2">
    <circle cx="690" cy="246" r="5"/><circle cx="850" cy="205" r="5"/>
    <circle cx="1010" cy="132" r="5"/><circle cx="1100" cy="88" r="7"/>
  </g>
  <path d="M1100 72 C1114 60 1130 62 1138 74 C1124 84 1108 84 1100 72 Z" fill="#7dffb2"/>

  <g fill="#ffc6dc" opacity="0.85">
    <ellipse cx="120" cy="120" rx="7" ry="4" transform="rotate(25 120 120)"/>
    <ellipse cx="300" cy="200" rx="6" ry="3.5" transform="rotate(-30 300 200)"/>
    <ellipse cx="520" cy="90" rx="7" ry="4" transform="rotate(40 520 90)"/>
    <ellipse cx="640" cy="180" rx="5" ry="3" transform="rotate(-15 640 180)"/>
    <ellipse cx="760" cy="110" rx="6" ry="3.5" transform="rotate(20 760 110)"/>
    <ellipse cx="980" cy="230" rx="7" ry="4" transform="rotate(-40 980 230)"/>
    <ellipse cx="1150" cy="190" rx="6" ry="3.5" transform="rotate(30 1150 190)"/>
    <ellipse cx="60" cy="250" rx="5" ry="3" transform="rotate(10 60 250)"/>
    <ellipse cx="420" cy="150" rx="5" ry="3" transform="rotate(-25 420 150)"/>
