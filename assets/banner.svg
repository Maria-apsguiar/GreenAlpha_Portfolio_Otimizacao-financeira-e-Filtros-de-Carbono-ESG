    <circle cx="960" cy="34" r="1.5"/><circle cx="1090" cy="72" r="1.2"/><circle cx="1160" cy="30" r="1.6"/>
  </g>

  <circle cx="860" cy="245" r="150" fill="url(#sun)" opacity="0.9"/>
  <circle cx="860" cy="245" r="70" fill="#fff0c4" opacity="0.95"/>

  <use href="#far" fill="#3b1f66" opacity="0.92"/>
  <use href="#near" fill="#150a30"/>
  <use href="#near" fill="url(#win)"/>

  <polyline points="600,268 690,246 770,252 850,205 930,182 1010,132 1100,88"
