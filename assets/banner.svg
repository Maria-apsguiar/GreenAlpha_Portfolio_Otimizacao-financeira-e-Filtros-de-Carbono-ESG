      <rect x="70" y="270" width="50" height="150"/>
      <rect x="120" y="310" width="80" height="110"/>
      <rect x="200" y="255" width="60" height="165"/>
      <rect x="260" y="295" width="70" height="125"/>
      <rect x="330" y="265" width="55" height="155"/>
      <rect x="385" y="305" width="90" height="115"/>
      <rect x="475" y="280" width="60" height="140"/>
      <rect x="535" y="315" width="80" height="105"/>
      <rect x="615" y="260" width="55" height="160"/>
      <rect x="670" y="300" width="90" height="120"/>
      <rect x="760" y="270" width="60" height="150"/>
      <rect x="820" y="310" width="75" height="110"/>
      <rect x="895" y="255" width="55" height="165"/>
      <rect x="950" y="295" width="85" height="125"/>
      <rect x="1035" y="275" width="60" height="145"/>
      <rect x="1095" y="305" width="105" height="115"/>
