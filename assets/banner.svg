      <rect x="90" y="305" width="70" height="115"/>
      <rect x="160" y="345" width="100" height="75"/>
      <rect x="260" y="290" width="64" height="130"/>
      <rect x="324" y="340" width="90" height="80"/>
      <rect x="414" y="318" width="70" height="102"/>
      <rect x="484" y="350" width="100" height="70"/>
      <rect x="584" y="300" width="66" height="120"/>
      <rect x="650" y="338" width="96" height="82"/>
      <rect x="746" y="312" width="70" height="108"/>
      <rect x="816" y="348" width="90" height="72"/>
      <rect x="906" y="296" width="64" height="124"/>
      <rect x="970" y="336" width="100" height="84"/>
      <rect x="1070" y="322" width="130" height="98"/>
