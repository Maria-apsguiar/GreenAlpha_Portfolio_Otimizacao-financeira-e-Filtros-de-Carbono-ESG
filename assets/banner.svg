<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="GreenAlpha - skyline de cidade ao entardecer com linha de crescimento">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160c3a"/>
      <stop offset="0.42" stop-color="#5a2a8a"/>
      <stop offset="0.72" stop-color="#e0568a"/>
      <stop offset="1" stop-color="#ffb46e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
